name: Deploy (Helm)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment/namespace"
        required: true
        default: "uber"
      imageTag:
        description: "Docker image tag for all services"
        required: true
        default: "latest"
      applyAlerts:
        description: "Apply Prometheus alert rules (k8s/alerts/prometheus-rules.yaml)"
        required: false
        default: "true"
  push:
    branches: [ "week-6" ]
    paths:
      - 'helm/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      KUBECONFIG_FILE: ${{ secrets.KUBE_CONFIG }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Configure kubeconfig
        if: env.KUBECONFIG_FILE != ''
        run: |
          echo "$KUBECONFIG_FILE" | base64 -d > kubeconfig
          echo "KUBECONFIG=$GITHUB_WORKSPACE/kubeconfig" >> $GITHUB_ENV

      - name: Create namespace if not exists
        run: |
          kubectl get ns ${{ github.event.inputs.environment || 'uber' }} || \
          kubectl create ns ${{ github.event.inputs.environment || 'uber' }}

      - name: Upgrade/Install booking-service
        run: |
          helm upgrade --install booking helm/booking \
            --namespace ${{ github.event.inputs.environment || 'uber' }} \
            --set image.tag=${{ github.event.inputs.imageTag || 'latest' }}

      - name: Upgrade/Install orchestrator-service
        run: |
          helm upgrade --install orchestrator helm/orchestrator \
            --namespace ${{ github.event.inputs.environment || 'uber' }} \
            --set image.tag=${{ github.event.inputs.imageTag || 'latest' }}

      - name: Upgrade/Install notification-service
        run: |
          helm upgrade --install notification helm/notification \
            --namespace ${{ github.event.inputs.environment || 'uber' }} \
            --set image.tag=${{ github.event.inputs.imageTag || 'latest' }}

      - name: Wait for deployments to become ready
        run: |
          ns=${{ github.event.inputs.environment || 'uber' }}
          # rollout names follow chart fullname: <chart>-<release>
          kubectl rollout status deploy/booking-booking -n $ns --timeout=180s || true
          kubectl rollout status deploy/orchestrator-orchestrator -n $ns --timeout=180s || true
          kubectl rollout status deploy/notification-notification -n $ns --timeout=180s || true

      - name: Show pods and services
        run: |
          ns=${{ github.event.inputs.environment || 'uber' }}
          kubectl get pods -n $ns -o wide || true
          kubectl get svc -n $ns || true

      - name: Apply Prometheus alert rules (optional)
        if: ${{ github.event.inputs.applyAlerts == 'true' }}
        run: |
          ns=${{ github.event.inputs.environment || 'uber' }}
          if [ -f k8s/alerts/prometheus-rules.yaml ]; then
            kubectl apply -n $ns -f k8s/alerts/prometheus-rules.yaml || true
          fi

      - name: Print ServiceMonitors, HPAs, and KEDA objects (if present)
        run: |
          ns=${{ github.event.inputs.environment || 'uber' }}
          kubectl get servicemonitor -n $ns || true
          kubectl get hpa -n $ns || true
          kubectl get scaledobject -n $ns || true
