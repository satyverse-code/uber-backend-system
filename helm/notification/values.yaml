replicaCount: 2

image:
  repository: your-registry/notification-service
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8092

ingress:
  enabled: true
  hostname: notification.example.com
  annotations:
    kubernetes.io/ingress.class: nginx

resources:
  requests:
    memory: "192Mi"
    cpu: "200m"
  limits:
    memory: "384Mi"
    cpu: "400m"

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8092
  initialDelaySeconds: 10
  periodSeconds: 10

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8092
  initialDelaySeconds: 30
  periodSeconds: 20

env:
  SPRING_PROFILES_ACTIVE: k8s
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/uberdb
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 75

# KEDA-based autoscaling by Kafka lag
keda:
  enabled: true
  minReplicaCount: 1
  maxReplicaCount: 8
  pollingInterval: 30
  cooldownPeriod: 600
  bootstrapServers: kafka:9092
  consumerGroup: notification-service-group
  lagThreshold: 100
  topics:
    - trip_created
    - driver_assigned
    - trip_completed
    - payment_completed

# Optional ServiceMonitor (for kube-prometheus-stack users)
monitoring:
  serviceMonitor:
    enabled: true
    namespace: ""
    extraLabels: {}
