replicaCount: 2

image:
  repository: your-registry/booking-service
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  hostname: booking.example.com
  annotations:
    kubernetes.io/ingress.class: nginx

resources:
  requests:
    memory: "192Mi"
    cpu: "200m"
  limits:
    memory: "384Mi"
    cpu: "400m"

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 10

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 20

env:
  SPRING_PROFILES_ACTIVE: k8s
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/uberdb
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  ANALYTICS_EXPORT_ENABLED: "false"
  ANALYTICS_S3_BUCKET: ""
  ANALYTICS_S3_PREFIX: "trip-events/"
  AWS_REGION: "us-east-1"
  # Provide keys via external secret manager in real deployments
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 75

# Optional ServiceMonitor (for kube-prometheus-stack users)
monitoring:
  serviceMonitor:
    enabled: false
    namespace: ""
    extraLabels: {}

pdb:
  enabled: true
  minAvailable: 1

serviceAccount:
  create: true
  annotations: {}

iam:
  useIRSA: false
  roleArn: ""
