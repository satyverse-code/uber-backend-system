replicaCount: 2

image:
  repository: your-registry/gateway-service
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8085

ingress:
  enabled: true
  hostname: gateway.example.com
  annotations:
    kubernetes.io/ingress.class: nginx

resources:
  requests:
    memory: "192Mi"
    cpu: "200m"
  limits:
    memory: "384Mi"
    cpu: "400m"

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8085
  initialDelaySeconds: 10
  periodSeconds: 10

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8085
  initialDelaySeconds: 30
  periodSeconds: 20

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 75

monitoring:
  serviceMonitor:
    enabled: true
    namespace: ""
    extraLabels: {}

pdb:
  enabled: true
  minAvailable: 1

env:
  JWT_ENABLED: "false"
  JWK_SET_URI: "http://keycloak:8080/realms/uber/protocol/openid-connect/certs"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  RATE_LIMIT_REPLENISH: "50"
  RATE_LIMIT_BURST: "100"
  RATE_LIMIT_BOOKING_REPLENISH: "40"
  RATE_LIMIT_BOOKING_BURST: "80"
  RATE_LIMIT_ORCH_REPLENISH: "20"
  RATE_LIMIT_ORCH_BURST: "40"
  RATE_LIMIT_NOTIF_REPLENISH: "30"
  RATE_LIMIT_NOTIF_BURST: "60"

secrets:
  create: false
  name: ""
  data:
    JWK_SET_URI: ""
    REDIS_PASSWORD: ""

rollout:
  enabled: false
  canary:
    setWeight: 20
    pauseSeconds: 60
  analysis:
    enabled: true
    templateName: gateway-success-rate
    prometheusAddress: http://prometheus-server.monitoring:80
    maxFailed: 1
    interval: 60s
