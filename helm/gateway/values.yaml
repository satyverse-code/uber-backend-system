replicaCount: 2

image:
  repository: your-registry/gateway-service
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8085

ingress:
  enabled: true
  hostname: gateway.example.com
  annotations:
    kubernetes.io/ingress.class: nginx

resources:
  requests:
    memory: "256Mi"
    cpu: "200m"
  limits:
    memory: "512Mi"
    cpu: "500m"

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8085
  initialDelaySeconds: 10
  periodSeconds: 10

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8085
  initialDelaySeconds: 30
  periodSeconds: 20

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 60

monitoring:
  serviceMonitor:
    enabled: false
    namespace: ""
    extraLabels: {}

pdb:
  enabled: true
  minAvailable: 1

env:
  JWT_ENABLED: "false"
  JWK_SET_URI: "http://keycloak:8080/realms/uber/protocol/openid-connect/certs"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  RATE_LIMIT_REPLENISH: "50"
  RATE_LIMIT_BURST: "100"

rollout:
  enabled: false
  canary:
    setWeight: 20
    pauseSeconds: 60
  analysis:
    enabled: true
    templateName: gateway-success-rate
    prometheusAddress: http://prometheus-server.monitoring:80
    maxFailed: 1
    interval: 60s
