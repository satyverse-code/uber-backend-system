replicaCount: 2

image:
  repository: your-registry/gateway-service
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8085

ingress:
  enabled: true
  hostname: gateway.example.com
  annotations:
    kubernetes.io/ingress.class: nginx

resources:
  requests:
    memory: "256Mi"
    cpu: "200m"
  limits:
    memory: "512Mi"
    cpu: "500m"

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8085
  initialDelaySeconds: 10
  periodSeconds: 10

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8085
  initialDelaySeconds: 30
  periodSeconds: 20

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 60

monitoring:
  serviceMonitor:
    enabled: false
    namespace: ""
    extraLabels: {}

pdb:
  enabled: true
  minAvailable: 1
