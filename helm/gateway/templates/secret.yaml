{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gateway.fullname" . }}-secret
  labels:
    app: {{ include "gateway.name" . }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
  annotations: {}
type: Opaque
stringData:
  JWK_SET_URI: {{ .Values.secrets.data.JWK_SET_URI | quote }}
  REDIS_PASSWORD: {{ .Values.secrets.data.REDIS_PASSWORD | quote }}
{{- end }}
