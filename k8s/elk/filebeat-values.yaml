daemonset:
  enabled: true

# Disable standalone deployment
deployment:
  enabled: false

filebeatConfig:
  filebeat.yml: |
    filebeat.autodiscover:
      providers:
        - type: kubernetes
          node: ${NODE_NAME}
          hints.enabled: true
          templates:
            - condition:
                equals:
                  kubernetes.namespace: uber
              config:
                - type: container
                  paths:
                    - /var/log/containers/*${data.kubernetes.container.id}.log
                  processors:
                    - add_kubernetes_metadata:
                        in_cluster: true
                    - decode_json_fields:
                        fields: ["message"]
                        target: "json"
                        overwrite_keys: true
                    - rename:
                        fields:
                          - from: "json.traceId"
                            to: "traceId"
                          - from: "json.spanId"
                            to: "spanId"
                        ignore_missing: true
                        fail_on_error: false
    processors:
      - add_cloud_metadata: {}
      - add_host_metadata: {}
    output.elasticsearch:
      hosts: ["http://elasticsearch-master:9200"]
      index: "app-logs-%{+yyyy.MM.dd}"

extraEnvs:
  - name: NODE_NAME
    valueFrom:
      fieldRef:
        fieldPath: spec.nodeName

# RBAC and permissions
rbac:
  create: true
serviceAccount:
  create: true

# Mount container logs
daemonsetVolumes:
  - name: varlog
    hostPath:
      path: /var/log
      type: Directory
  - name: varlibdockercontainers
    hostPath:
      path: /var/lib/docker/containers
      type: DirectoryOrCreate
  - name: varlibcontainers
    hostPath:
      path: /var/lib/containers
      type: DirectoryOrCreate

daemonsetVolumeMounts:
  - name: varlog
    mountPath: /var/log
    readOnly: true
  - name: varlibdockercontainers
    mountPath: /var/lib/docker/containers
    readOnly: true
  - name: varlibcontainers
    mountPath: /var/lib/containers
    readOnly: true
