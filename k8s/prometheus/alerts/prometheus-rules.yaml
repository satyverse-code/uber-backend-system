groups:
- name: chaos-and-performance
  rules:
  - alert: BookingErrorSpike
    expr: rate(http_server_requests_seconds_count{application="booking-service",status=~"5.."}[2m]) / rate(http_server_requests_seconds_count{application="booking-service"}[2m]) > 0.05
    for: 1m
    labels:
      severity: warning
    annotations:
      summary: "Booking failures spiked (>5% in 2m)"
      description: "Failure rate for booking-service exceeded 5% in the last 2 minutes."

  - alert: HighErrorRateAllServices
    expr: increase(http_server_requests_seconds_count{status=~"5.."}[5m]) > 50
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: "High 5xx rate across services"
      description: "Detected >50 5xx responses over the last 5 minutes across services."

  - alert: ConsumerLagHigh
    expr: sum(kafka_consumergroup_lag) by (consumergroup) > 1000
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: "Kafka consumer lag high"
      description: "Consumer group {{ $labels.consumergroup }} lag is above 1000."

  - alert: P95LatencyHigh
    expr: histogram_quantile(0.95, sum by (le, application) (rate(http_server_requests_seconds_bucket[5m]))) > 1.5
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: "High p95 latency (>1.5s)"
      description: "Service {{ $labels.application }} p95 latency exceeded 1.5s."

  - alert: HPASaturation
    expr: (kube_hpa_status_current_replicas / kube_hpa_spec_max_replicas) >= 0.95
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "HPA saturation (>=95% of max)"
      description: "HPA {{ $labels.hpa }} running at or near max replicas."

  - alert: KEDASaturationApprox
    expr: (kube_deployment_status_replicas{namespace="uber"} / kube_hpa_spec_max_replicas{namespace="uber"}) >= 0.95
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "KEDA/HPA near max"
      description: "Deployment {{ $labels.deployment }} near max replicas."
