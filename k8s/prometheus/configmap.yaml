apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
  labels:
    app: prometheus-standalone

data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 30s

    rule_files:
      - /etc/prometheus/rules/alerts.yaml

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'uber-services'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
              - 'gateway.uber.svc.cluster.local:8085'
              - 'booking.uber.svc.cluster.local:8080'
              - 'orchestrator.uber.svc.cluster.local:8090'
              - 'notification.uber.svc.cluster.local:8092'
