apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: uber-alerts
  labels:
    release: prometheus
spec:
  groups:
    - name: UberAlerts
      rules:
        - alert: KafkaLagHigh
          expr: sum(kafka_consumergroup_lag) by (consumer_group) > 500
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Kafka lag too high for {{ $labels.consumer_group }}"
            description: "The consumer group lag is above 500 for 5m."
        - alert: BookingFailureSpike
          expr: rate(ride_failed_count[5m]) > 5
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Booking failures spiking"
            description: "Ride failed count > 5/min over last 2m."
        - alert: AssignmentLatencyP90High
          expr: histogram_quantile(0.90, sum(rate(ride_assignment_latency_seconds_bucket[5m])) by (le)) > 2
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Assignment latency p90 is high"
            description: "p90 assignment latency > 2s for 2m."
