server:
  port: 8085

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      default-filters:
        - PreserveHostHeader
      routes:
        - id: booking
          uri: http://booking:8080
          predicates:
            - Path=/api/booking/**
          filters:
            - StripPrefix=1
        - id: orchestrator
          uri: http://orchestrator:8090
          predicates:
            - Path=/api/orchestrator/**
          filters:
            - StripPrefix=1
        - id: notification
          uri: http://notification:8092
          predicates:
            - Path=/api/notification/**
          filters:
            - StripPrefix=1
  main:
    web-application-type: reactive

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: gateway-service
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4317

# Security placeholder for JWT readiness
jwt:
  enabled: false
