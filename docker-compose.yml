version: "3.8"
services:
  postgres:
    image: postgres:15
    container_name: uber_postgres
    restart: always
    environment:
      POSTGRES_DB: uberdb
      POSTGRES_USER: uberuser
      POSTGRES_PASSWORD: uberpass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
